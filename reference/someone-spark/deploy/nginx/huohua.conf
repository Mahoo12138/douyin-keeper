# Huohua 站点 Nginx 样例（宝塔「网站」配置）

# 放到站点根对应的 conf，或在宝塔「配置文件」里合并。
# 上游 API 必须是本机，不要 listen 公网 8080。

upstream huohua_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name example.com;
    root /www/wwwroot/huohua/spark/frontend/dist;
    index index.html;
    client_max_body_size 2m;
    # /api/ 不要开 proxy_cache：GET /api/v1/csrf 靠 Set-Cookie 种 huohua_csrf。
    # proxy_set_header 只覆盖下面列出的头；X-CSRF-Token 等自定义头默认原样转发，不要写成空、不要 proxy_hide_header。
    # 不要用下划线头名（X_CSRF_TOKEN）；Nginx 默认丢弃带下划线的请求头。
    location /api/ {
        proxy_pass http://huohua_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 360s;
    }
    location ~ ^/api/v1/douyin/.+/login/events {
        proxy_pass http://huohua_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location = /healthz {
        proxy_pass http://huohua_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /readyz {
        proxy_pass http://huohua_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
