name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @douyin-keeper/contracts validate

  backend:
    name: Backend (build + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  backend-integration:
    name: Backend (integration, real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: douyin_keeper_test
          POSTGRES_USER: keeper
          POSTGRES_PASSWORD: change-me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://keeper:change-me@localhost:5432/douyin_keeper_test?sslmode=disable

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @douyin-keeper/sdk-ts generate
      - run: pnpm --filter @douyin-keeper/ui-web typecheck
      - run: pnpm --filter @douyin-keeper/sdk-ts typecheck
      - run: pnpm --filter @douyin-keeper/sdk-ts test
      - run: pnpm --filter @douyin-keeper/web gen && pnpm --filter @douyin-keeper/web typecheck
      - run: pnpm --filter @douyin-keeper/web test
      - run: pnpm build:spa

  sidecar:
    name: Sidecar (protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r sidecars/playwright/requirements.txt
      - run: python -m pytest sidecars/playwright/tests -q
