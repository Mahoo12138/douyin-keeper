openapi: 3.1.0
info:
  title: Douyin Keeper Next API
  version: 1.0.0-draft
servers:
- url: /api/v1
paths:
  /me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /admin/users:
    get:
      operationId: listAdminUsers
      parameters:
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Administrator user summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /admin/accounts:
    get:
      operationId: listAdminAccounts
      parameters:
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Administrator account summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAccount'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /admin/workers:
    get:
      operationId: getAdminRuntime
      responses:
        '200':
          description: Administrator worker and queue runtime summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRuntime'
  /admin/adapters:
    get:
      operationId: listAdminAdapters
      responses:
        '200':
          description: Administrator adapter health summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAdapter'
  /admin/adapters/{adapter}:
    patch:
      operationId: updateAdminAdapter
      parameters:
      - name: adapter
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated adapter state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAdapter'
  /accounts:
    get:
      operationId: listAccounts
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /accounts/bindings:
    post:
      operationId: createAccountBinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                method:
                  type: string
                  enum:
                  - qr
      responses:
        '202':
          description: Binding job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
  /accounts/{accountId}/session-check:
    post:
      operationId: checkAccountSession
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '202':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
  /accounts/{accountId}/friends-sync:
    post:
      operationId: syncAccountFriends
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '202':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
  /accounts/{accountId}/capabilities:
    get:
      operationId: getAccountCapabilities
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Capability snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Capability'
  /accounts/{accountId}/friends:
    get:
      operationId: listFriends
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Friends
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Friend'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /friends/{friendId}:
    patch:
      operationId: updateFriend
      parameters:
      - name: friendId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                spark_enabled:
                  type: boolean
      responses:
        '200':
          description: Updated friend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks:
    get:
      operationId: listTasks
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SparkTask'
                  next_cursor:
                    type:
                    - string
                    - 'null'
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkTask'
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                timezone:
                  type: string
                window_start:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
                window_end:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
                message:
                  type: object
                  additionalProperties: false
                  required:
                  - kind
                  properties:
                    kind:
                      type: string
                      enum:
                      - text
                      - sticker
                    body:
                      type:
                      - string
                      - 'null'
                allow_first_message:
                  type: boolean
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkTask'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
  /tasks/{taskId}/run-now:
    post:
      operationId: runTaskNow
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Send queued
          content:
            application/json:
              schema:
                type: object
                required:
                - intent_id
                - job_id
                - status
                properties:
                  intent_id:
                    type: string
                    format: uuid
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - queued
  /send-intents:
    get:
      operationId: listSendIntents
      parameters:
      - name: account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: friend_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - queued
          - running
          - retry_wait
          - succeeded
          - failed
          - skipped
          - cancelled
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Send history
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SendIntent'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /send-jobs/{jobId}:
    get:
      operationId: getSendJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Send job diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendJob'
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{jobId}/events:
    get:
      operationId: streamJobEvents
      description: Replay and stream append-only job events as Server-Sent Events.
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job event stream. Each SSE frame carries event, id, and a JSON payload in data.
          content:
            text/event-stream:
              schema:
                type: string
  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Cancellation requested
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/refresh:
    post:
      operationId: refreshSession
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type:
                  - string
                  - 'null'
                  description: Required for mini clients; web uses HttpOnly refresh cookie.
      responses:
        '200':
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Current session revoked
  /auth/logout-all:
    post:
      operationId: logoutAll
      responses:
        '204':
          description: All sessions revoked
  /auth/link-codes:
    post:
      operationId: createWechatLinkCode
      responses:
        '201':
          description: One-time link code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCode'
  /auth/wechat-mini/link:
    post:
      operationId: linkWechatMini
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLinkRequest'
      responses:
        '200':
          description: Linked and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/wechat-mini/login:
    post:
      operationId: loginWechatMini
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/entitlement:
    get:
      operationId: getMyEntitlement
      responses:
        '200':
          description: Effective entitlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveEntitlement'
  /entitlements/redeem:
    post:
      operationId: redeemCardCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemCardRequest'
      responses:
        '200':
          description: Redeemed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
        '409':
          $ref: '#/components/responses/Conflict'
  /entitlements/redemptions:
    get:
      operationId: listMyEntitlementGrants
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntitlementGrant'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    User:
      type: object
      required:
      - id
      - display_name
      - role
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum:
          - user
          - admin
    AdminUser:
      type: object
      required:
      - id
      - display_name
      - role
      - status
      - created_at
      - account_count
      - task_count
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum:
          - user
          - admin
        status:
          type: string
          enum:
          - active
          - disabled
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        account_count:
          type: integer
          minimum: 0
        task_count:
          type: integer
          minimum: 0
        entitlement_expires_at:
          type:
          - string
          - 'null'
          format: date-time
    AdminAccountCapability:
      type: object
      required:
      - name
      - status
      - checked_at
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - available
          - degraded
          - unavailable
          - unknown
        adapter:
          type:
          - string
          - 'null'
        error_code:
          type:
          - string
          - 'null'
        checked_at:
          type: string
          format: date-time
    AdminRecentError:
      type: object
      required:
      - category
      - code
      - severity
      - created_at
      properties:
        category:
          type: string
        code:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        source_adapter:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    AdminAccount:
      type: object
      required:
      - id
      - owner_id
      - owner_display_name
      - nickname
      - binding_status
      - session_status
      - risk_status
      - capabilities
      - today_send_succeeded
      - today_send_failed
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        owner_display_name:
          type: string
        platform_user_id:
          type:
          - string
          - 'null'
        nickname:
          type: string
        binding_status:
          type: string
          enum:
          - unbound
          - binding
          - bound
          - released
        session_status:
          type: string
          enum:
          - unknown
          - valid
          - expired
          - challenge_required
        risk_status:
          type: string
          enum:
          - normal
          - cooling_down
          - paused
        paused_at:
          type:
          - string
          - 'null'
          format: date-time
        cooldown_until:
          type:
          - string
          - 'null'
          format: date-time
        last_session_check_at:
          type:
          - string
          - 'null'
          format: date-time
        last_friend_sync_at:
          type:
          - string
          - 'null'
          format: date-time
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountCapability'
        today_send_succeeded:
          type: integer
          minimum: 0
        today_send_failed:
          type: integer
          minimum: 0
        latest_error:
          oneOf:
          - $ref: '#/components/schemas/AdminRecentError'
          - type: 'null'
    AdminWorkerPool:
      type: object
      required:
      - name
      - online
      - active_workers
      - concurrency
      properties:
        name:
          type: string
        online:
          type: boolean
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        last_observed_at:
          type:
          - string
          - 'null'
          format: date-time
        active_workers:
          type: integer
          minimum: 0
        concurrency:
          type: integer
          minimum: 0
        version:
          type:
          - string
          - 'null'
        playwright_version:
          type:
          - string
          - 'null'
        protocol_version:
          type:
          - string
          - 'null'
    AdminQueue:
      type: object
      required:
      - name
      - pool
      - pending
      - active
      - scheduled
      - retry
      - failed
      - processed
      - latency_seconds
      - paused
      properties:
        name:
          type: string
        pool:
          type: string
        pending:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        scheduled:
          type: integer
          minimum: 0
        retry:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        processed:
          type: integer
          minimum: 0
        latency_seconds:
          type: integer
          minimum: 0
        paused:
          type: boolean
    AdminRuntime:
      type: object
      required:
      - observed_at
      - pools
      - queues
      - running_jobs
      - failed_jobs_24h
      - browser_slots_used
      - browser_slots_limit
      - scheduler_online
      properties:
        observed_at:
          type: string
          format: date-time
        api_version:
          type:
          - string
          - 'null'
        worker_version:
          type:
          - string
          - 'null'
        playwright_sidecar_version:
          type:
          - string
          - 'null'
        protocol_sidecar_version:
          type:
          - string
          - 'null'
        pools:
          type: array
          items:
            $ref: '#/components/schemas/AdminWorkerPool'
        queues:
          type: array
          items:
            $ref: '#/components/schemas/AdminQueue'
        running_jobs:
          type: integer
          minimum: 0
        failed_jobs_24h:
          type: integer
          minimum: 0
        browser_slots_used:
          type: integer
          minimum: 0
        browser_slots_limit:
          type: integer
          minimum: 0
        scheduler_online:
          type: boolean
        scheduler_leader_expires_at:
          type:
          - string
          - 'null'
          format: date-time
    AdminAdapter:
      type: object
      required:
      - name
      - status
      - enabled
      - executable
      - failure_count
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - healthy
          - degraded
          - down
          - disabled
          - unknown
        enabled:
          type: boolean
        executable:
          type: boolean
        version:
          type:
          - string
          - 'null'
        error_code:
          type:
          - string
          - 'null'
        failure_count:
          type: integer
          minimum: 0
        circuit_open_until:
          type:
          - string
          - 'null'
          format: date-time
        checked_at:
          type:
          - string
          - 'null'
          format: date-time
    Account:
      type: object
      required:
      - id
      - nickname
      - binding_status
      - session_status
      - risk_status
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        avatar_url:
          type:
          - string
          - 'null'
          format: uri
        binding_status:
          type: string
          enum:
          - unbound
          - binding
          - bound
          - released
        session_status:
          type: string
          enum:
          - unknown
          - valid
          - expired
          - challenge_required
        risk_status:
          type: string
          enum:
          - normal
          - cooling_down
          - paused
        last_session_check_at:
          type:
          - string
          - 'null'
          format: date-time
        last_friend_sync_at:
          type:
          - string
          - 'null'
          format: date-time
        paused_at:
          type:
          - string
          - 'null'
          format: date-time
    Capability:
      type: object
      required:
      - capability
      - status
      - checked_at
      properties:
        capability:
          type: string
        status:
          type: string
          enum:
          - available
          - degraded
          - unavailable
          - unknown
        adapter:
          type:
          - string
          - 'null'
        error_code:
          type:
          - string
          - 'null'
        checked_at:
          type: string
          format: date-time
    Friend:
      type: object
      required:
      - id
      - platform_identity_status
      - display_name
      - streak_days
      - has_conversation
      - spark_enabled
      properties:
        id:
          type: string
          format: uuid
        platform_identity_status:
          type: string
          enum:
          - pending
          - resolved
          - ambiguous
          - missing
        display_name:
          type: string
        nickname:
          type: string
        short_id:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
          format: uri
        streak_days:
          type: integer
          minimum: 0
        has_conversation:
          type: boolean
        spark_enabled:
          type: boolean
