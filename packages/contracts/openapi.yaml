openapi: 3.1.0
info:
  title: Douyin Keeper Next API
  version: 1.0.0-draft
servers:
- url: /api/v1
paths:
  /me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /admin/users:
    get:
      operationId: listAdminUsers
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Administrator user summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /admin/accounts:
    get:
      operationId: listAdminAccounts
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Administrator account summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAccount'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /admin/accounts/{accountId}/pause:
    post:
      operationId: pauseAdminAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paused administrator account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
  /admin/accounts/{accountId}/resume:
    post:
      operationId: resumeAdminAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Resumed administrator account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
  /admin/entitlement-plans:
    get:
      operationId: listAdminEntitlementPlans
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Administrator entitlement plans
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminEntitlementPlan'
                  next_cursor:
                    type: string
                    nullable: true
    post:
      operationId: createAdminEntitlementPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateEntitlementPlanRequest'
      responses:
        '201':
          description: Created entitlement plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEntitlementPlan'
  /admin/entitlement-plans/{planId}/disable:
    post:
      operationId: disableAdminEntitlementPlan
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Entitlement plan disabled
  /admin/card-batches:
    get:
      operationId: listAdminCardBatches
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Administrator card batch summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminCardBatch'
                  next_cursor:
                    type:
                    - string
                    - 'null'
    post:
      operationId: createAdminCardBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateCardBatchRequest'
      responses:
        '201':
          description: Created card batch with plaintext codes available once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreateCardBatchResponse'
  /admin/card-batches/{batchId}:
    get:
      operationId: getAdminCardBatch
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Administrator card batch detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCardBatch'
  /admin/card-batches/{batchId}/disable:
    post:
      operationId: disableAdminCardBatch
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Card batch disabled
  /admin/redemptions:
    get:
      operationId: listAdminRedemptions
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Administrator redemption and grant history without plaintext card codes
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminRedemption'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /admin/users/{userId}/entitlements:
    get:
      operationId: getAdminUserEntitlements
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: User entitlement history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEntitlements'
  /admin/users/{userId}/entitlement-grants:
    post:
      operationId: createAdminUserEntitlementGrant
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateEntitlementGrantRequest'
      responses:
        '201':
          description: Created administrator grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRedemption'
  /admin/entitlement-grants/{grantId}/revoke:
    post:
      operationId: revokeAdminEntitlementGrant
      parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRevokeEntitlementRequest'
      responses:
        '204':
          description: Entitlement grant revoked
  /admin/card-batches/{batchId}/codes:
    get:
      operationId: listAdminCardCodes
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Card code summaries without plaintext codes
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminCardCode'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /admin/card-batches/{batchId}/codes/{codeId}/revoke:
    post:
      operationId: revokeAdminCardCode
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: codeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRevokeEntitlementRequest'
      responses:
        '204':
          description: Unused card code revoked
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        '200':
          description: Administrator operations overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
  /admin/workers:
    get:
      operationId: getAdminRuntime
      responses:
        '200':
          description: Administrator worker and queue runtime summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRuntime'
  /admin/jobs:
    get:
      operationId: listAdminJobs
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - waiting_user
          - succeeded
          - failed
          - cancelled
      - name: type
        in: query
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Redacted generic Job lifecycle summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminJob'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /admin/adapters:
    get:
      operationId: listAdminAdapters
      responses:
        '200':
          description: Administrator adapter health summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAdapter'
  /admin/adapters/{adapter}:
    patch:
      operationId: updateAdminAdapter
      parameters:
      - name: adapter
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated adapter state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAdapter'
  /admin/risks:
    get:
      operationId: listAdminRisks
      parameters:
      - name: category
        in: query
        schema:
          type: string
          enum:
          - AUTH
          - PLATFORM
          - PROTOCOL
          - BROWSER
          - NETWORK
          - DATA
      - name: severity
        in: query
        schema:
          type: string
          enum:
          - info
          - warning
          - critical
      - name: code
        in: query
        schema:
          type: string
          maxLength: 100
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Administrator risk event summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminRisk'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      parameters:
      - name: action
        in: query
        schema:
          type: string
          maxLength: 100
      - name: resource_type
        in: query
        schema:
          type: string
          maxLength: 100
      - name: actor
        in: query
        schema:
          type: string
          maxLength: 100
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Administrator audit log summaries without raw detail JSON
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAuditLog'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /admin/settings:
    get:
      operationId: listAdminSettings
      responses:
        '200':
          description: Administrator site settings without raw audit detail
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSetting'
  /admin/settings/{key}:
    patch:
      operationId: updateAdminSetting
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{0,63}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettingUpdate'
      responses:
        '200':
          description: Updated site setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
  /accounts:
    get:
      operationId: listAccounts
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /accounts/bindings:
    post:
      operationId: createAccountBinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                method:
                  type: string
                  enum:
                  - qr
                  - sms
                phone:
                  type: string
                  minLength: 5
                  maxLength: 32
      responses:
        '202':
          description: Binding job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
  /accounts/{accountId}/session-check:
    post:
      operationId: checkAccountSession
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '202':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
  /accounts/{accountId}/pause:
    post:
      operationId: pauseAccount
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Account tasks paused
  /accounts/{accountId}/resume:
    post:
      operationId: resumeAccount
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Account tasks resumed
  /accounts/{accountId}:
    delete:
      operationId: deleteAccount
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Account released and future work cancelled
  /accounts/{accountId}/friends-sync:
    post:
      operationId: syncAccountFriends
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '202':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
  /accounts/{accountId}/capabilities:
    get:
      operationId: getAccountCapabilities
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Capability snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Capability'
  /notifications:
    get:
      operationId: listNotifications
      parameters:
      - name: unread_only
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current user's in-app notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
  /notifications/preferences:
    get:
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Current user's notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
    patch:
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - wechat_enabled
              properties:
                wechat_enabled:
                  type: boolean
      responses:
        '200':
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: Number of notifications marked read
          content:
            application/json:
              schema:
                type: object
                required:
                - marked_count
                properties:
                  marked_count:
                    type: integer
                    minimum: 0
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Notification marked read
  /accounts/{accountId}/friends:
    get:
      operationId: listFriends
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Friends
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Friend'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /accounts/{accountId}/conversations:
    get:
      operationId: listConversations
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /accounts/{accountId}/conversations/{conversationId}:
    patch:
      operationId: setConversationArchived
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - archived
              properties:
                archived:
                  type: boolean
      responses:
        '200':
          description: Updated conversation archive state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /message-templates:
    get:
      operationId: listMessageTemplates
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - text
          - sticker
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Current user's reusable message templates
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageTemplate'
                  next_cursor:
                    type:
                    - string
                    - 'null'
    post:
      operationId: createMessageTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - kind
              - body
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                kind:
                  type: string
                  enum:
                  - text
                  - sticker
                body:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '201':
          description: Created message template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplate'
        '409':
          $ref: '#/components/responses/Conflict'
  /message-templates/{templateId}:
    patch:
      operationId: updateMessageTemplate
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                kind:
                  type: string
                  enum:
                  - text
                  - sticker
                body:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: Updated message template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplate'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteMessageTemplate
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Message template deleted
  /friends/{friendId}:
    patch:
      operationId: updateFriend
      parameters:
      - name: friendId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                spark_enabled:
                  type: boolean
      responses:
        '200':
          description: Updated friend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks:
    get:
      operationId: listTasks
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SparkTask'
                  next_cursor:
                    type:
                    - string
                    - 'null'
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkTask'
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                timezone:
                  type: string
                window_start:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
                window_end:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
                message:
                  type: object
                  additionalProperties: false
                  required:
                  - kind
                  - body
                  properties:
                    kind:
                      type: string
                      enum:
                      - text
                      - sticker
                    body:
                      type: string
                      minLength: 1
                      maxLength: 500
