        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkTask'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
  /tasks/{taskId}/run-now:
    post:
      operationId: runTaskNow
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Send queued
          content:
            application/json:
              schema:
                type: object
                required:
                - intent_id
                - job_id
                - status
                properties:
                  intent_id:
                    type: string
                    format: uuid
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - queued
  /send-intents:
    get:
      operationId: listSendIntents
      parameters:
      - name: account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: friend_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - queued
          - running
          - retry_wait
          - succeeded
          - failed
          - skipped
          - cancelled
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Send history
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SendIntent'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /send-jobs/{jobId}:
    get:
      operationId: getSendJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Send job diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendJob'
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{jobId}/events:
    get:
      operationId: streamJobEvents
      description: Replay and stream append-only job events as Server-Sent Events.
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Last-Event-ID
        in: header
        required: false
        description: Resume after a disconnect; only events with a larger sequence are replayed.
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Job event stream. Each SSE frame carries event, id, and a JSON payload in data.
          content:
            text/event-stream:
              schema:
                type: string
  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Cancellation requested
        '409':
          $ref: '#/components/responses/Conflict'
  /jobs/{jobId}/sms-verify:
    post:
      operationId: submitSMSVerification
      description: Submit a short-lived SMS code to an owned waiting SMS binding job. The code is never persisted.
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{4,8}$
      responses:
        '202':
          description: Verification code accepted for delivery to the waiting worker
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - verification_submitted
        '409':
          $ref: '#/components/responses/Conflict'
